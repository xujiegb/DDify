name: License Scan

on:
  workflow_dispatch:

  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  license-scan:
    name: Scan licenses
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ScanCode Toolkit
        run: |
          python3 -m pip install --upgrade pip
          pip install scancode-toolkit

      - name: Run license scan
        run: |
          scancode \
            --license \
            --copyright \
            --package \
            --info \
            --strip-root \
            --json-pp scancode-report.json \
            .

      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: license-scan-report
          path: scancode-report.json
