name: DDify Test
on:
  workflow_dispatch:
  pull_request:
    paths: ['ddify.sh', 'tests/qemu-reinstall.sh', '.github/workflows/DDify-test.yml']
  push:
    branches: [main]
    paths: ['ddify.sh', 'tests/qemu-reinstall.sh', '.github/workflows/DDify-test.yml']
permissions:
  contents: read
jobs:
  reinstall:
    name: ${{ matrix.source }} -> ${{ matrix.target }} (UEFI amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        source: [rocky, freebsd]
        target: [rocky, freebsd]
    env:
      SOURCE_OS: ${{ matrix.source }}
      TARGET_OS: ${{ matrix.target }}
      VM_RAM_MIB: '5120'
      WORK: ${{ runner.temp }}/ddify-qemu
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install QEMU and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf cloud-image-utils openssh-client openssl xz-utils curl
          if [[ -e /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          df -h "$RUNNER_TEMP"
          free -h
      - name: Shell syntax
        run: bash -n ddify.sh && bash -n tests/qemu-reinstall.sh
      - name: Reinstall and verify two boots
        run: bash tests/qemu-reinstall.sh
      - name: Upload logs even when installation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ matrix.source }}-to-${{ matrix.target }}
          path: ${{ runner.temp }}/ddify-qemu/logs/
          if-no-files-found: warn
          retention-days: 7
