name: DDify Test
on:
  workflow_dispatch:
  pull_request:
    paths: ['ddify.sh', '.github/workflows/DDify-test.yml']
  push:
    branches: [main]
    paths: ['ddify.sh', '.github/workflows/DDify-test.yml']
permissions:
  contents: read
jobs:
  reinstall:
    name: ${{ matrix.source }} -> ${{ matrix.target }} (UEFI amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        source: [rocky, freebsd]
        target: [rocky, freebsd]
    env:
      SOURCE_OS: ${{ matrix.source }}
      TARGET_OS: ${{ matrix.target }}
      VM_RAM_MIB: '5120'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install QEMU and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf cloud-image-utils openssh-client openssl xz-utils curl
          if [[ -e /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          df -h "$RUNNER_TEMP"
          free -h
      - name: Shell syntax
        run: bash -n ddify.sh
      - name: Reinstall and verify two boots
        shell: bash
        env:
          WORK: ${{ runner.temp }}/ddify-qemu
        run: |
          set -Eeuo pipefail
          export LC_ALL=C
          : "${SOURCE_OS:?}" "${TARGET_OS:?}"
          case "$SOURCE_OS:$TARGET_OS" in rocky:rocky|rocky:freebsd|freebsd:rocky|freebsd:freebsd) ;; *) exit 2;; esac
          WORK=${WORK:-$(mktemp -d)}
          RAM=${VM_RAM_MIB:-5120}
          REPO="${GITHUB_WORKSPACE:?}"
          # All VM storage is disposable local files, never runner block devices.
          mkdir -p "$WORK/logs"
          WORK=$(cd "$WORK" && pwd)
          cd "$WORK"
          LOG=$WORK/logs
          exec > >(tee -a "$LOG/test.log") 2>&1
          PID=''
          cleanup() {
              local rc=$?
              trap - EXIT
              if [[ -n "$PID" ]]; then
                  kill "$PID" 2>/dev/null || true
                  wait "$PID" 2>/dev/null || true
              fi
              if ((rc != 0)); then tail -c 24000 "$LOG/serial.log" 2>/dev/null || true; fi
              rm -f "$WORK/source-key" "$WORK/target-key" "$WORK/user-data" "$WORK/seed.iso"
              exit "$rc"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          fail() { echo "ERROR: $*" >&2; exit 1; }
          fetch() { curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 30 --max-time 1800 --proto '=https' --proto-redir '=https' -o "$2.part" "$1" && mv "$2.part" "$2"; }
          case "$SOURCE_OS" in
              rocky) url=https://download.rockylinux.org/pub/rocky/10/images/x86_64/Rocky-10-EC2-LVM.latest.x86_64.qcow2 ;;
              freebsd) url=https://download.freebsd.org/releases/VM-IMAGES/15.1-RELEASE/amd64/Latest/FreeBSD-15.1-RELEASE-amd64-BASIC-CLOUDINIT-ufs.qcow2.xz ;;
          esac
          name=${url##*/}
          fetch "$url" "$name"
          if [[ "$SOURCE_OS" == rocky ]]; then
              fetch "$url.CHECKSUM" checksum
          else
              fetch "${url%/*}/CHECKSUM.SHA256" checksum
          fi
          hash=$(awk -v f="$name" '$1=="SHA256" && $2=="("f")" && $3=="=" {print $4; exit} $2==f || $2=="*"f {print $1; exit}' checksum)
          [[ "$hash" =~ ^[[:xdigit:]]{64}$ ]] || fail "Source checksum missing: $name"
          printf '%s  %s\n' "$hash" "$name" | sha256sum -c -
          if [[ "$name" == *.xz ]]; then xz -d "$name"; name=${name%.xz}; fi
          qemu-img check "$name"
          mv "$name" disk.qcow2
          # The source is the same disk later reinstalled by DDify.
          qemu-img resize disk.qcow2 24G
          qemu-img info disk.qcow2 | tee "$LOG/source-image.txt"
          ssh-keygen -q -t ed25519 -N '' -f source-key
          ssh-keygen -q -t ed25519 -N '' -f target-key
          source_key=$(cat source-key.pub)
          # Only bootstrap the SOURCE guest. Remove this ISO before running DDify.
          root_hash=$(openssl rand -hex 32 | openssl passwd -6 -stdin)
          cat > user-data <<EOF
          #cloud-config
          ssh_pwauth: false
          disable_root: false
          users:
            - default
            - name: root
              lock_passwd: false
              hashed_passwd: '$root_hash'
              ssh_authorized_keys:
                - '$source_key'
          chpasswd:
            expire: false
            users:
              - name: root
                password: '$root_hash'
                type: hash
          runcmd:
            - |
                set -e
                mkdir -p /root/.ssh
                chmod 0700 /root/.ssh
                printf '%s\\n' '$source_key' > /root/.ssh/authorized_keys
                chmod 0600 /root/.ssh/authorized_keys
                cfg=/etc/ssh/sshd_config
                tmp=\$(mktemp)
                { printf 'PermitRootLogin prohibit-password\\nPasswordAuthentication no\\nPubkeyAuthentication yes\\n'; cat "\$cfg"; } > "\$tmp"
                cat "\$tmp" > "\$cfg"
                rm -f "\$tmp"
                sshd -t
                if [ "\$(uname -s)" = FreeBSD ]; then
                  sysrc sshd_enable=YES
                  service sshd restart || service sshd start
                else
                  systemctl enable --now sshd
                  systemctl restart sshd
                fi
          EOF
          printf 'instance-id: ddify-ci-source-%s\nlocal-hostname: ddify-source\n' "$SOURCE_OS" > meta-data
          cloud-localds seed.iso user-data meta-data
          rm -f user-data
          # Non-Secure-Boot UEFI, persistent NVRAM across reboots and QEMU restarts.
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd
          CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
          [[ -r "$CODE" ]] || fail 'OVMF firmware not found'
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
              accel=kvm; cpu=host
          else
              accel=tcg; cpu=max
          fi
          printf 'QEMU accelerator: %s\n' "$accel"
          start_vm() {
              local extra=()
              if [[ "${1:-}" == seed ]]; then extra=(-drive "file=$WORK/seed.iso,format=raw,media=cdrom,readonly=on"); fi
              qemu-system-x86_64 -machine "q35,accel=$accel" -cpu "$cpu" -smp 2 -m "$RAM" \
                  -drive "if=pflash,format=raw,readonly=on,file=$CODE" \
                  -drive "if=pflash,format=raw,file=$WORK/vars.fd" \
                  -drive "if=none,id=system,format=qcow2,file=$WORK/disk.qcow2,discard=unmap,detect-zeroes=unmap" \
                  -device virtio-blk-pci,drive=system,serial=DDIFYCI001,bootindex=1 \
                  -netdev user,id=net,hostfwd=tcp:127.0.0.1:2222-:22 \
                  -device virtio-net-pci,netdev=net \
                  -display none -monitor none -serial stdio "${extra[@]}" >> "$LOG/serial.log" 2>&1 &
              PID=$!
          }
          ssh_guest() {
              local key=$1; shift
              timeout "${SSH_TIMEOUT:-45s}" ssh -T -p 2222 -i "$WORK/$key-key" -o IdentitiesOnly=yes -o BatchMode=yes \
                  -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 \
                  -o LogLevel=ERROR root@127.0.0.1 "$@"
          }
          assert_os() {
              local key=$1 os=$2
              case "$os" in
                  rocky) ssh_guest "$key" 'test "$(uname -s)" = Linux && . /etc/os-release && test "$ID" = rocky && case "$VERSION_ID" in 10|10.*) true;; *) false;; esac' ;;
                  freebsd) ssh_guest "$key" 'test "$(uname -s)" = FreeBSD && case "$(freebsd-version -u)" in 15.*) true;; *) false;; esac' ;;
              esac
          }
          wait_os() {
              local key=$1 os=$2 end=$((SECONDS+$3))
              until assert_os "$key" "$os" >/dev/null 2>&1; do
                  kill -0 "$PID" 2>/dev/null || fail 'QEMU exited unexpectedly'
                  ((SECONDS < end)) || fail "Timeout waiting for $os using $key key"
                  sleep 10
              done
          }
          cloud_wait() {
              local key=$1 tag=${2:-$1}
              SSH_TIMEOUT=600s ssh_guest "$key" 'cloud-init status --wait --long' | tee "$LOG/cloud-init-$tag.txt"
          }
          boot_id() {
              ssh_guest "$1" 'if [ "$(uname -s)" = FreeBSD ]; then sysctl -n kern.boottime; else cat /proc/sys/kernel/random/boot_id; fi'
          }
          shutdown_vm() {
              ssh_guest "$1" 'if [ "$(uname -s)" = FreeBSD ]; then shutdown -p now; else systemctl poweroff; fi' || true
              local end=$((SECONDS+180))
              while kill -0 "$PID" 2>/dev/null; do
                  ((SECONDS < end)) || fail 'Guest did not power off'
                  sleep 3
              done
              wait "$PID" || fail 'QEMU exited abnormally'
              PID=''
          }
          collect_guest() {
              local key=$1 tag=$2
              ssh_guest "$key" 'uname -a; df -h; if [ "$(uname -s)" = FreeBSD ]; then freebsd-version -ku; gpart show -l; efibootmgr -v; else cat /etc/os-release; lsblk -f; findmnt /; efibootmgr -v; fi' > "$LOG/$tag-system.txt" 2>&1 || true
              ssh_guest "$key" 'cat /var/log/cloud-init.log /var/log/cloud-init-output.log 2>/dev/null' > "$LOG/$tag-cloud-init.log" 2>&1 || true
          }
          start_vm seed
          wait_os source "$SOURCE_OS" 900
          cloud_wait source
          # Provision only tools required to INVOKE DDify; other dependencies are
          # DDify's responsibility.
          if [[ "$SOURCE_OS" == freebsd ]]; then
              SSH_TIMEOUT=900s ssh_guest source 'env ASSUME_ALWAYS_YES=yes pkg bootstrap; env ASSUME_ALWAYS_YES=yes pkg install bash curl' | tee "$LOG/source-deps.log"
          else
              ssh_guest source 'command -v bash && command -v curl' || fail 'Rocky source lacks bash/curl'
          fi
          ssh_guest source 'touch /var/tmp/ddify-old-system-marker'
          collect_guest source source
          shutdown_vm source
          # No external CIDATA medium may survive into rescue/target boot.
          rm -f seed.iso
          start_vm
          wait_os source "$SOURCE_OS" 900
          ssh_guest source 'test -f /var/tmp/ddify-old-system-marker'
          ssh_guest source 'cat > /root/ddify.sh' < "$REPO/ddify.sh"
          ssh_guest source 'cat > /root/ddify-target.pub' < target-key.pub
          case "$SOURCE_OS" in rocky) disk=/dev/vda;; freebsd) disk=/dev/vtbd0;; esac
          case "$TARGET_OS" in rocky) version=10;; freebsd) version=15;; esac
          # Explicit disk confirmation is 1. Exercise the default verified-before-wipe
          # path and official image URL, not --allow-early-wipe or --img.
          ssh_guest source "printf '%s\\n' 1 > /root/ddify-confirm; nohup bash /root/ddify.sh $TARGET_OS $version --disk $disk --ssh-key /root/ddify-target.pub --web-port 18080 < /root/ddify-confirm > /var/tmp/ddify-host.log 2>&1 &"
          end=$((SECONDS+3600))
          while :; do
              kill -0 "$PID" 2>/dev/null || fail 'QEMU stopped during reinstall'
              if assert_os target "$TARGET_OS" >/dev/null 2>&1 && ssh_guest target 'test ! -e /var/tmp/ddify-old-system-marker && test "$(cat /etc/reinstall-web-port 2>/dev/null)" = 18080' >/dev/null 2>&1; then break; fi
              if ssh_guest source 'test -f /var/tmp/ddify-host.log' >/dev/null 2>&1; then
                  ssh_guest source 'cat /var/tmp/ddify-host.log' > "$LOG/host-install.log.tmp" 2>/dev/null && mv "$LOG/host-install.log.tmp" "$LOG/host-install.log" || true
              fi
              if ssh_guest target 'test -f /var/log/reinstall-auto.log' >/dev/null 2>&1; then
                  ssh_guest target 'cat /var/log/reinstall-auto.log' > "$LOG/rescue.log.tmp" 2>/dev/null && mv "$LOG/rescue.log.tmp" "$LOG/rescue.log" || true
                  if grep -Eq 'Installer phase finished with rc=[1-9][0-9]*' "$LOG/rescue.log"; then fail 'DDify installer reported failure'; fi
              fi
              ((SECONDS < end)) || fail 'Target did not boot with new credentials and marker'
              sleep 10
          done
          cloud_wait target first-boot
          collect_guest target first-boot
          first=$(boot_id target)
          ssh_guest target 'if [ "$(uname -s)" = FreeBSD ]; then shutdown -r now; else systemctl reboot; fi' || true
          end=$((SECONDS+900))
          while :; do
              current=$(boot_id target 2>/dev/null || true)
              [[ -z "$current" || "$current" == "$first" ]] || break
              kill -0 "$PID" 2>/dev/null || fail 'QEMU stopped on second boot'
              ((SECONDS < end)) || fail 'No new boot ID after reboot'
              sleep 10
          done
          assert_os target "$TARGET_OS"
          cloud_wait target second-boot
          ssh_guest target 'test ! -e /var/tmp/ddify-old-system-marker && test "$(cat /etc/reinstall-web-port)" = 18080 && test "$(id -u)" = 0'
          if ssh_guest source true >/dev/null 2>&1; then fail 'Old source SSH key still grants root access'; fi
          collect_guest target second-boot
          case "$TARGET_OS" in
              rocky) ssh_guest target 'test -d /sys/firmware/efi && labels=$(lsblk -nr -o PARTLABEL) && ! printf "%s\n" "$labels" | grep -ix CIDATA' ;;
              freebsd) ssh_guest target 'test -c /dev/efi && layout=$(gpart show -l) && ! printf "%s\n" "$layout" | grep -w CIDATA' ;;
          esac
          echo "PASS: $SOURCE_OS -> $TARGET_OS (two boots, new SSH key, NoCloud marker, old system absent, CIDATA removed)"
      - name: Upload logs even when installation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ matrix.source }}-to-${{ matrix.target }}
          path: ${{ runner.temp }}/ddify-qemu/logs/
          if-no-files-found: warn
          retention-days: 7
